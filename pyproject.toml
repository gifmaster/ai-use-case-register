[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usecasereg"
version = "0.1.0"
description = "AI use case register with governance intensity and health checks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alexander Senderovitz", email = "alexander@senderovitz.eu"}]
dependencies = ["pyyaml>=6.0", "openpyxl>=3.1", "fpdf2>=2.8"]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2", "pandas>=2.0"]
dev = ["pytest>=8", "streamlit>=1.50,<2", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usecasereg = ["rules/*.yaml", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
